name: Build Android (.apk)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-capacitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Patch manifest permissions + WebRTC
        run: python3 scripts/patch-android.py
      - name: Sync web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android && ./gradlew assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ALLALONE-android-apk
          path: android-capacitor/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

# Release (signed .aab) is intentionally not automated here because it needs
# your keystore. To add it: store the keystore + passwords as repo secrets,
# add a signing block to android/app/build.gradle, and run `./gradlew bundleRelease`.
