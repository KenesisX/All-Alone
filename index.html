<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ALLALONE // Sensor Command Suite</title>
<style>
  :root{
    --bg:#000000; --bg2:#141418; --panel:rgba(22,22,26,.82); --char:#1b1b20; --grey:#8a8a92;
    --grid:rgba(255,42,58,.12); --line:rgba(255,42,58,.30);
    --cyan:#ff2a3a; --cyan2:#ffffff; --amber:#ffb020; --red:#ff2a3a;
    --green:#ffffff; --violet:#ff5a6e; --txt:#ffffff; --dim:#8a8a92;
    --mono:'SFMono-Regular',ui-monospace,'JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);
    font-family:var(--mono);font-size:13px;letter-spacing:.3px;user-select:none}
  body{background:
    radial-gradient(130% 90% at 50% -10%,rgba(130,0,18,.24),transparent 60%),
    radial-gradient(120% 120% at 100% 120%,rgba(90,0,12,.18),transparent 55%),
    var(--bg);}
  #app{position:fixed;inset:0;display:flex;flex-direction:column}

  /* ===== top status bar ===== */
  #topbar{height:34px;flex:0 0 34px;display:flex;align-items:center;gap:10px;
    padding:0 10px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(34,34,38,.35),transparent);backdrop-filter:blur(6px);z-index:40}
  #brand{font-weight:700;color:var(--cyan);text-shadow:0 0 10px rgba(255,42,58,.5);
    letter-spacing:2px;font-size:13px}
  #brand b{color:#fff}
  #armBtn{color:#ffd54a;border-color:#ffd54a;background:rgba(70,54,0,.45);box-shadow:0 0 8px rgba(255,200,40,.4);transition:.3s}
  #armBtn.armed{color:#ff4df0;border-color:#ff4df0;background:rgba(74,0,66,.5);box-shadow:0 0 16px rgba(255,77,240,.8);animation:fxpulse 1.6s infinite}
  @keyframes fxpulse{0%,100%{box-shadow:0 0 10px rgba(255,77,240,.5)}50%{box-shadow:0 0 22px rgba(255,77,240,1)}}
  #lightscreen{position:fixed;inset:0;z-index:118;background:#fff;display:none}
  #lightscreen.on{display:block}
  .pill{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:10px;
    padding:2px 7px;white-space:nowrap}
  .pill.on{color:var(--green);border-color:rgba(235,235,240,.5);text-shadow:0 0 6px rgba(235,235,240,.4)}
  #topspace{flex:1}
  #clock{color:var(--cyan2);font-size:11px}

  /* ===== main stage + right rail ===== */
  #body{flex:1;display:flex;min-height:0}
  #stage{flex:1;position:relative;min-width:0;overflow:hidden}
  .page{position:absolute;inset:0;display:none;flex-direction:column;overflow:hidden}
  .page.active{display:flex;animation:fade .35s ease}
  @keyframes fade{from{opacity:0;transform:scale(.995)}to{opacity:1}}

  /* right scroll rail with cyber sprite icons */
  #rail{flex:0 0 64px;border-left:1px solid var(--line);background:linear-gradient(180deg,var(--bg2),#0e0e12);
    overflow-y:auto;overflow-x:hidden;scrollbar-width:none;z-index:30;
    display:flex;flex-direction:column;align-items:center;padding:6px 0 60px}
  #rail::-webkit-scrollbar{display:none}
  .ric{width:52px;height:52px;margin:4px 0;border:1px solid transparent;border-radius:11px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;
    cursor:pointer;position:relative;transition:.18s;flex:0 0 auto}
  .ric svg{width:24px;height:24px}
  .rgrp{font-size:7px;color:var(--grey);letter-spacing:1.5px;margin:7px 0 1px;opacity:.7;width:100%;text-align:center;
    border-top:1px solid rgba(255,42,58,.14);padding-top:5px}
  .rgrp:first-child{border-top:0}
  .ric .lbl{font-size:7.5px;color:var(--dim);letter-spacing:.5px;text-align:center;line-height:1}
  .ric:hover{border-color:var(--line);background:rgba(255,42,58,.05)}
  .ric.sel{border-color:var(--cyan);background:rgba(255,42,58,.10);box-shadow:0 0 14px rgba(255,42,58,.25) inset}
  .ric.sel .lbl{color:var(--cyan)}
  .ric.sel svg{filter:drop-shadow(0 0 5px rgba(255,42,58,.8))}
  .stroke{stroke:var(--cyan);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
  .fill{fill:var(--cyan)}

  /* generic UI bits */
  .hd{display:flex;align-items:center;gap:8px;padding:7px 11px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(34,34,38,.3),transparent);flex:0 0 auto;z-index:5}
  .hd h2{margin:0;font-size:13px;color:var(--cyan);letter-spacing:1.5px;text-transform:uppercase;
    text-shadow:0 0 8px rgba(255,42,58,.4)}
  .hd .sub{color:var(--dim);font-size:10px}
  .hd .sp{flex:1}
  .grow{flex:1;min-height:0;position:relative}
  canvas{display:block;width:100%;height:100%}
  .ctrls{flex:0 0 auto;display:flex;flex-wrap:wrap;gap:6px;padding:8px 10px;border-top:1px solid var(--line);
    background:rgba(12,12,14,.6);align-items:center;max-height:44%;overflow-y:auto;scrollbar-width:thin}
  .btn{font-family:var(--mono);font-size:11px;color:var(--txt);background:rgba(34,34,38,.4);
    border:1px solid var(--line);border-radius:7px;padding:6px 10px;cursor:pointer;transition:.15s;white-space:nowrap}
  .btn:hover{border-color:var(--cyan);color:#fff}
  .btn.on{background:rgba(255,42,58,.16);border-color:var(--cyan);color:var(--cyan);
    box-shadow:0 0 10px rgba(255,42,58,.3)}
  .btn.danger.on{background:rgba(255,59,82,.18);border-color:var(--red);color:var(--red);box-shadow:0 0 12px rgba(255,59,82,.4)}
  .chip{font-size:10px;color:var(--dim);border:1px solid var(--line);border-radius:6px;padding:4px 8px}
  .chip b{color:var(--cyan2)}
  label.sl{display:flex;align-items:center;gap:7px;font-size:10px;color:var(--dim);min-width:150px}
  input[type=range]{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;flex:1;
    background:linear-gradient(90deg,var(--cyan),var(--violet));outline:none}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;
    background:#0e0e12;border:2px solid var(--cyan);box-shadow:0 0 8px var(--cyan);cursor:pointer}
  select,input[type=text],input[type=number]{font-family:var(--mono);font-size:11px;color:var(--txt);
    background:rgba(24,24,28,.7);border:1px solid var(--line);border-radius:6px;padding:5px 7px}

  /* readout HUD */
  .hud{position:absolute;pointer-events:none;font-size:10px;color:var(--cyan);z-index:6;
    text-shadow:0 0 6px rgba(0,0,0,.9)}
  .scan-corners::before,.scan-corners::after{content:'';position:absolute;width:26px;height:26px;
    border:2px solid var(--cyan);pointer-events:none;opacity:.6}
  .scan-corners::before{top:8px;left:8px;border-right:0;border-bottom:0}
  .scan-corners::after{bottom:54px;right:8px;border-left:0;border-top:0}

  /* point-click info popup */
  #pop{position:absolute;z-index:60;min-width:168px;max-width:230px;background:rgba(3,14,18,.95);
    border:1px solid var(--cyan);border-radius:10px;padding:10px;display:none;
    box-shadow:0 0 24px rgba(0,0,0,.7),0 0 18px rgba(255,42,58,.25);backdrop-filter:blur(4px)}
  #pop h4{margin:0 0 6px;color:var(--cyan);font-size:11px;letter-spacing:1px;display:flex;justify-content:space-between}
  #pop .x{cursor:pointer;color:var(--red);font-weight:700}
  #pop .row{display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin:3px 0}
  #pop .row b{color:var(--txt)}
  #pop input{width:100%;margin-top:6px}
  #pop .act{margin-top:7px;width:100%;text-align:center}

  table{width:100%;border-collapse:collapse;font-size:10px}
  th,td{text-align:left;padding:4px 7px;border-bottom:1px solid rgba(255,42,58,.08);white-space:nowrap}
  th{color:var(--cyan);position:sticky;top:0;background:#141418;z-index:2}
  td b{color:var(--txt)}
  .sig{color:var(--green)} .sigw{color:var(--amber)} .sigb{color:var(--red)}
  .scroll{overflow:auto;scrollbar-width:thin}

  #toast{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:90;
    background:rgba(3,16,20,.95);border:1px solid var(--cyan);border-radius:9px;padding:9px 14px;
    font-size:11px;color:var(--cyan);display:none;box-shadow:0 0 20px rgba(255,42,58,.3);max-width:86%}
  #flash{position:fixed;inset:0;z-index:95;background:#fff;opacity:0;pointer-events:none}
  .mini{position:absolute;left:8px;bottom:52px;font-size:9px;color:var(--dim);z-index:6;pointer-events:none;
    background:rgba(0,0,0,.35);padding:3px 6px;border-radius:5px;border:1px solid rgba(255,42,58,.12)}
  video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .bcard{background:var(--char);border:1px solid var(--line);border-radius:10px;padding:10px}
  .btitle{color:var(--red);font-size:11px;letter-spacing:1px;text-transform:uppercase;margin-bottom:7px}
  .brow{display:flex;gap:6px;margin:5px 0;flex-wrap:wrap;align-items:center}
  .brow input[type=text],.brow input[type=number]{flex:1;min-width:120px}
  .bnote{font-size:10px;color:var(--grey);line-height:1.5;margin-top:5px}
  .proto{margin:0;font-size:9.5px;color:var(--grey);white-space:pre-wrap;line-height:1.45}
  .warn{color:var(--amber)}
  .no{color:var(--red)}
  .legend{position:absolute;right:8px;top:8px;font-size:9px;color:var(--dim);z-index:6;text-align:right;
    background:rgba(0,0,0,.3);padding:4px 7px;border-radius:5px;border:1px solid rgba(255,42,58,.12)}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div id="brand">ALL<b>ALONE</b></div>
    <button id="medBtn" title="Medical ID">⚕ MED&nbsp;ID</button>
    <button id="helpBtn" title="How to use this page">?</button>
    <span class="pill" id="pCam">CAM ○</span>
    <span class="pill" id="pMic">MIC ○</span>
    <span class="pill" id="pImu">IMU ○</span>
    <span class="pill" id="pMag">MAG ○</span>
    <button class="btn" id="armBtn" style="padding:3px 9px;font-size:10px">◉ ARM ALL</button>
    <div id="topspace"></div>
    <span class="pill" id="pFreq">f: 2.437 GHz</span>
    <span id="clock">--:--:--</span>
  </div>
  <div id="body">
    <div id="stage"><!-- pages injected --></div>
    <div id="rail"><!-- icons injected --></div>
  </div>
</div>
<div id="pop"></div>
<div id="toast"></div>
<div id="flash"></div>
<div id="lightscreen"></div>

<script>
"use strict";
/* ============================================================
   ALLALONE — real device-sensor instrument suite
   Vanilla JS. One file. Everything runs on the phone's own
   camera / mic / IMU / magnetometer + Web Audio.
   ============================================================ */

const $=(s,r=document)=>r.querySelector(s);
const el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const rnd=(a,b)=>a+Math.random()*(b-a);
const fmt=(n,d=2)=>Number(n).toFixed(d);
const stage=$('#stage'), rail=$('#rail');

/* shared live state ------------------------------------------------ */
const S={
  freqHz:2.437e9,          // "present value being scanned"
  running:true,
  audioReady:false, analyser:null, freqData:null, timeData:null, audioCtx:null,
  micLevel:0, micPeak:0, bands:new Array(64).fill(0),
  imu:{ax:0,ay:0,az:0, mag:0, vib:0, hist:new Array(256).fill(0)},
  heading:0, headingOK:false,
  camStream:null, camFacing:'environment',
  blips:[],                // radar contacts
  devices:[],              // simulated SDR/MAC table
  csi:{subc:new Array(64).fill(0), presence:0, rate:0, phase:0},
};

/* toast ------------------------------------------------------------ */
let toT;
function toast(msg,ms=2600){const t=$('#toast');t.innerHTML=msg;t.style.display='block';
  clearTimeout(toT);toT=setTimeout(()=>t.style.display='none',ms);}

/* clock + freq pill ------------------------------------------------ */
setInterval(()=>{const d=new Date();
  $('#clock').textContent=d.toLocaleTimeString('en-GB');},1000);
function freqLabel(hz){
  if(hz>=1e9)return fmt(hz/1e9,3)+' GHz';
  if(hz>=1e6)return fmt(hz/1e6,3)+' MHz';
  if(hz>=1e3)return fmt(hz/1e3,2)+' kHz';
  return fmt(hz,0)+' Hz';}
function setFreq(hz){S.freqHz=hz;$('#pFreq').textContent='f: '+freqLabel(hz);
  window.dispatchEvent(new Event('freqchange'));}

/* ================= SENSOR ACQUISITION ============================ */
async function initAudio(existing){
  if(S.audioReady===true)return true;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')try{await ctx.resume();}catch(e){}
    let stream=(existing&&existing.getAudioTracks&&existing.getAudioTracks().length)?existing:null;
    if(!stream)stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    const src=ctx.createMediaStreamSource(stream);
    const an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.72;src.connect(an);
    S.audioCtx=ctx;S.analyser=an;S.micStream=stream;
    S.freqData=new Uint8Array(an.frequencyBinCount);
    S.timeData=new Uint8Array(an.fftSize);
    S.audioReady=true;$('#pMic').className='pill on';$('#pMic').textContent='MIC ●';
    return true;
  }catch(e){toast('<span class="no">Mic blocked</span> — demo signal active');
    S.audioReady='demo';return false;}
}
function pollAudio(){
  if(S.bridgeLive&&performance.now()-S.bridgeTS<1500){ // live SDR feed drives the spectrum
    let s=0;for(const b of S.bands)s+=b;S.micLevel=clamp(s/S.bands.length,0,1);S.micPeak=clamp(S.micLevel*1.6,0,1);return;}
  if(S.audioReady===true&&S.analyser){
    S.analyser.getByteFrequencyData(S.freqData);
    S.analyser.getByteTimeDomainData(S.timeData);
    let sum=0,peak=0;for(let i=0;i<S.freqData.length;i++){const v=S.freqData[i];sum+=v;if(v>peak)peak=v;}
    S.micLevel=sum/S.freqData.length/255;S.micPeak=peak/255;
    const bn=S.bands.length,step=(S.freqData.length/bn)|0;
    for(let b=0;b<bn;b++){let m=0;for(let i=0;i<step;i++)m=Math.max(m,S.freqData[b*step+i]);
      S.bands[b]=S.bands[b]*.4+(m/255)*.6;}
  }else{ // demo synthesized spectrum
    const t=performance.now()/1000;
    for(let b=0;b<S.bands.length;b++){
      const base=Math.exp(-b/22)*.6, w=(Math.sin(t*2+b*.4)*.5+.5);
      S.bands[b]=clamp(base*w + Math.random()*.08 + (b===((t*4)%S.bands.length|0)?.5:0),0,1);}
    S.micLevel=.18+Math.sin(t*3)*.12+Math.random()*.05;S.micPeak=clamp(S.micLevel*2,0,1);
  }
}

function camError(e){const n=(e&&e.name)||'';
  if(n==='NotAllowedError'||n==='SecurityError')
    toast('<span class="no">Camera blocked.</span> Open this artifact full-screen (↗ in a new tab) and allow camera when prompted.',7000);
  else if(n==='NotFoundError')toast('<span class="no">No camera found</span> on this device.',5000);
  else if(n==='NotReadableError')toast('<span class="no">Camera busy</span> — close other apps using it.',5000);
  else toast('<span class="no">Camera error:</span> '+(n||(e&&e.message)||'unknown'),5000);}
function camVideoConstraint(){ // use chosen webcam/device if set, else front/back
  return S.camDeviceId ? {deviceId:{exact:S.camDeviceId},width:{ideal:1280},height:{ideal:720}}
                       : {facingMode:{ideal:S.camFacing},width:{ideal:1280},height:{ideal:720}};
}
async function populateCams(sel){ // list every connected camera (webcam, USB, phone)
  if(!sel||!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return;
  try{const devs=await navigator.mediaDevices.enumerateDevices();
    const cams=devs.filter(d=>d.kind==='videoinput');
    sel.innerHTML='<option value="">Auto (front/back)</option>'+cams.map((c,i)=>`<option value="${c.deviceId}">${(c.label||('Camera '+(i+1))).replace(/[<>]/g,'')}</option>`).join('');
    sel.value=S.camDeviceId||'';
  }catch(e){}
}
async function startCam(){
  if(!S.vidEl)return false;
  try{
    if(S.camStream)S.camStream.getTracks().forEach(t=>{if(t.kind==='video')t.stop();});
    const st=await navigator.mediaDevices.getUserMedia({video:camVideoConstraint(),audio:false});
    S.camStream=st;S.vidEl.srcObject=st;S.vidEl.setAttribute('playsinline','');
    await S.vidEl.play().catch(()=>{});
    S.camRunning=true;$('#pCam').className='pill on';$('#pCam').textContent='CAM ●';
    if(S.camSelEl)populateCams(S.camSelEl);
    if(S.onCamChange)S.onCamChange(true);return true;
  }catch(e){S.camRunning=false;$('#pCam').className='pill';$('#pCam').textContent='CAM ✕';
    camError(e);if(S.onCamChange)S.onCamChange(false);return false;}
}
async function flipCam(){S.camDeviceId=null;S.camFacing=S.camFacing==='environment'?'user':'environment';if(S.camRunning)await startCam();}

function initMotion(){
  function onMotion(e){
    const a=e.accelerationIncludingGravity||e.acceleration;if(!a)return;
    S.imu.ax=a.x||0;S.imu.ay=a.y||0;S.imu.az=a.z||0;
    const m=Math.hypot(S.imu.ax,S.imu.ay,S.imu.az);
    S.imu.vib=Math.abs(m-(S.imu.mag||m));S.imu.mag=m;
    S.imu.hist.push(S.imu.vib);if(S.imu.hist.length>256)S.imu.hist.shift();
    $('#pImu').className='pill on';$('#pImu').textContent='IMU ●';
  }
  function onOrient(e){
    let h=e.webkitCompassHeading!=null?e.webkitCompassHeading:(e.alpha!=null?360-e.alpha:null);
    if(h!=null){S.heading=h;S.headingOK=true;
      $('#pMag').className='pill on';$('#pMag').textContent='MAG ●';}
    if(e.beta!=null)S.pitch=e.beta;    // front-back tilt (sky view + compass perspective)
    if(e.gamma!=null)S.roll=e.gamma;   // left-right tilt
  }
  window.addEventListener('devicemotion',onMotion);
  window.addEventListener('deviceorientationabsolute',onOrient);
  window.addEventListener('deviceorientation',onOrient);
}
// ONE arming flow — requests motion/orientation, then camera+mic in a single prompt
async function armAll(){
  armed=true;
  try{ if(typeof DeviceMotionEvent!=='undefined'&&DeviceMotionEvent.requestPermission)
    await DeviceMotionEvent.requestPermission(); }catch(e){}
  try{ if(typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)
    await DeviceOrientationEvent.requestPermission(); }catch(e){}
  initMotion();
  try{
    const st=await navigator.mediaDevices.getUserMedia({
      video:camVideoConstraint(),
      audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    S.camStream=st;
    if(S.vidEl){S.vidEl.srcObject=st;S.vidEl.setAttribute('playsinline','');await S.vidEl.play().catch(()=>{});}
    S.camRunning=true;$('#pCam').className='pill on';$('#pCam').textContent='CAM ●';
    if(S.camSelEl)populateCams(S.camSelEl);
    if(S.onCamChange)S.onCamChange(true);
    await initAudio(st);                 // reuse same stream's audio for the FFT
    loadWeather();
    toast('Armed · camera + mic + motion + compass online',3200);
  }catch(e){
    camError(e);                          // camera blocked — still bring up mic + motion
    await initAudio();
    if(S.onCamChange)S.onCamChange(false);
  }
}
const requestSensors=armAll;              // alias for older call sites

/* simulated SDR / device survey (browsers cannot scan RF/WiFi) ----- */
const VENDORS=['Espressif','Raspberry Pi','Ubiquiti','Hikvision','Axis','Cisco','TP-Link','Unknown','Shelly','Dahua'];
function seedDevices(){
  S.devices=[];
  for(let i=0;i<9;i++){
    const mac=Array.from({length:6},()=>('0'+(Math.random()*256|0).toString(16)).slice(-2)).join(':').toUpperCase();
    S.devices.push({mac,
      rssi:-(30+Math.random()*65|0),
      ch:[1,6,11,36,40,44][Math.random()*6|0],
      band:Math.random()<.6?'2.4G':'5G',
      vendor:VENDORS[Math.random()*VENDORS.length|0],
      type:['WiFi-AP','WiFi-STA','BLE','Zigbee','Sub-GHz'][Math.random()*5|0],
      ang:Math.random()*360, r:.3+Math.random()*.65, drift:rnd(-.3,.3)});}
}
// slow RSSI wobble + table churn
function evolveDevices(){ for(const d of S.devices) d.rssi=clamp(d.rssi+rnd(-2,2),-99,-25); }
// real-time kinematics: objects sit STATIC, then burst into MOVING and get tracked live
let _lastK=performance.now();
function updateMotion(){
  const now=performance.now(), dt=Math.min(120,now-_lastK)/1000; _lastK=now;
  for(const d of S.devices){
    if(d.moving===undefined){d.moving=false;d.still=99;d.speed=0;d.trail=[];
      d.tAng=d.ang;d.tR=d.r;d.moveUntil=0;d.px=d.ang;d.pr=d.r;}
    // Demo device emitters stay perfectly STATIC — no fabricated jitter.
    // Only real bridge-fed devices change position, so only genuine movement reads as moving.
    // measure displacement → motion state (real for ext; always ~0 for demo)
    let da=d.ang-d.px; while(da>180)da-=360; while(da<-180)da+=360;
    const dr=d.r-d.pr;
    d.speed=(Math.abs(da)+Math.abs(dr)*80)/Math.max(dt,.001)*0.016;
    d.px=d.ang; d.pr=d.r;

      d.trail.push({a:d.ang*Math.PI/180,r:d.r}); if(d.trail.length>42)d.trail.shift(); }
    else { d.still++; if(d.still>10){ d.moving=false; if(d.trail.length)d.trail.shift(); } }
  }
}

/* ================================================================
   REAL-TIME MOTION DETECTION (camera frame-differencing)
   Only reports a contact when actual motion is present, and sizes it.
   ================================================================ */
S.motion={blobs:[],level:0,ts:0};
function classifySize(areaFrac,wFrac,hFrac){
  const tall=hFrac>wFrac*1.4;
  if(areaFrac<0.006) return {k:'tiny', name:'bird / squirrel', col:'#8a8a92', px:4};
  if(areaFrac<0.020) return {k:'small',name:'cat / rabbit',    col:'#ffffff', px:6};
  if(areaFrac<0.060) return {k:'mid',  name:tall?'dog / child':'dog / medium', col:'#ffb020', px:9};
  if(areaFrac<0.200) return {k:'human',name:tall?'human-size':'large animal', col:'#e01020', px:12};
  return {k:'large', name:'very large / vehicle', col:'#ff5a6e', px:15};
}
function blobify(grid,GX,GY){
  const thr=2, seen=new Uint8Array(GX*GY), blobs=[], st=[];
  for(let i=0;i<grid.length;i++){ if(seen[i]||grid[i]<thr)continue;
    let n=0,sx=0,sy=0,minx=GX,maxx=0,miny=GY,maxy=0; st.length=0; st.push(i); seen[i]=1;
    while(st.length){ const j=st.pop(), jx=j%GX, jy=(j/GX)|0;
      n++; sx+=jx+0.5; sy+=jy+0.5;
      if(jx<minx)minx=jx; if(jx>maxx)maxx=jx; if(jy<miny)miny=jy; if(jy>maxy)maxy=jy;
      if(jx>0&&!seen[j-1]&&grid[j-1]>=thr){seen[j-1]=1;st.push(j-1);}
      if(jx<GX-1&&!seen[j+1]&&grid[j+1]>=thr){seen[j+1]=1;st.push(j+1);}
      if(jy>0&&!seen[j-GX]&&grid[j-GX]>=thr){seen[j-GX]=1;st.push(j-GX);}
      if(jy<GY-1&&!seen[j+GX]&&grid[j+GX]>=thr){seen[j+GX]=1;st.push(j+GX);} }
    if(n>=2)blobs.push({n,cx:sx/n/GX,cy:sy/n/GY,w:(maxx-minx+1)/GX,h:(maxy-miny+1)/GY}); }
  return blobs;
}
const MOT={W:160,H:120,prev:null,c:null,x:null,last:0};
function motionTick(){
  if(performance.now()-MOT.last<66)return; MOT.last=performance.now();
  if(!S.camRunning||!S.vidEl||!S.vidEl.videoWidth){S.motion.blobs=[];return;}
  if(!MOT.c){MOT.c=document.createElement('canvas');MOT.c.width=MOT.W;MOT.c.height=MOT.H;
    MOT.x=MOT.c.getContext('2d',{willReadFrequently:true});}
  MOT.x.drawImage(S.vidEl,0,0,MOT.W,MOT.H);
  let cur;try{cur=MOT.x.getImageData(0,0,MOT.W,MOT.H);}catch(e){return;}
  if(!MOT.prev){MOT.prev=cur;return;}
  const GX=48,GY=36,grid=new Float32Array(GX*GY),d=cur.data,pd=MOT.prev.data;let total=0; // finer grid
  for(let y=0;y<MOT.H;y++)for(let x=0;x<MOT.W;x++){const i=(y*MOT.W+x)*4;
    const dl=Math.abs(d[i]-pd[i])+Math.abs(d[i+1]-pd[i+1])+Math.abs(d[i+2]-pd[i+2]);
    if(dl>28){grid[((y/MOT.H*GY)|0)*GX+((x/MOT.W*GX)|0)]++;total++;}}  // lower threshold = more sensitive
  MOT.prev=cur;
  S.motion.blobs=blobify(grid,GX,GY).map(b=>({cx:b.cx,cy:b.cy,w:b.w,h:b.h,area:b.n/(GX*GY),
    cls:classifySize(b.n/(GX*GY),b.w,b.h)})).filter(b=>b.area>0.0016);  // catches squirrel-scale
  S.motion.level=total/(MOT.W*MOT.H); S.motion.ts=performance.now();
  // honest behaviour read-out from kinematics (NOT a hostility verdict)
  MOT.hist=MOT.hist||[];MOT.hist.push(S.motion.level);if(MOT.hist.length>20)MOT.hist.shift();
  const mean=MOT.hist.reduce((a,b)=>a+b,0)/MOT.hist.length;
  const varc=MOT.hist.reduce((a,b)=>a+(b-mean)*(b-mean),0)/MOT.hist.length;
  const area=S.motion.blobs.reduce((a,b)=>a+b.area,0);
  S.motion.trend=area>(MOT.lastArea||0)*1.2?'approaching':area<(MOT.lastArea||0)*0.8?'moving off':'holding';
  MOT.lastArea=area;
  S.motion.pace=varc>0.0006?'fast/erratic':'steady';
}

/* ================= FILE SAVE (artifact downloads cap + fallback) == */
async function saveFile(filename,data){
  try{ if(window.claude&&claude.use){ const dl=await claude.use('downloads');
    if(dl){ await dl.save({filename,data}); toast('Saved: '+filename); return; } } }
  catch(e){ if(e&&e.code==='declined')return; }
  try{ const blob=data instanceof Blob?data:new Blob([data]);
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=filename;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);toast('Saved: '+filename);
  }catch(e){toast('Save failed');} }

/* ================= VIDEO RECORDING (MediaRecorder on canvas) ====== */
const REC={on:false,mr:null,chunks:[],canvas:null,ctx:null,btn:null,t0:0};
function startRec(btn,srcCanvas){
  try{
    REC.canvas=document.createElement('canvas');
    REC.canvas.width=srcCanvas.width;REC.canvas.height=srcCanvas.height;
    REC.ctx=REC.canvas.getContext('2d');
    const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
    const mt=types.find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
    const st=REC.canvas.captureStream(30);
    REC.chunks=[];REC.mr=new MediaRecorder(st,mt?{mimeType:mt}:undefined);
    REC.mr.ondataavailable=e=>{if(e.data&&e.data.size)REC.chunks.push(e.data);};
    REC.mr.onstop=()=>{const blob=new Blob(REC.chunks,{type:REC.mr.mimeType||'video/webm'});
      saveFile('allalone_'+Date.now()+(((REC.mr.mimeType||'').includes('mp4'))?'.mp4':'.webm'),blob);};
    REC.mr.start();REC.on=true;REC.btn=btn;REC.t0=performance.now();
    if(btn){btn.classList.add('on');btn.textContent='■ STOP';}
    toast('● Recording…');
  }catch(e){toast('Record failed: '+(e.message||e.name));}
}
function stopRec(btn){ if(REC.mr&&REC.on){try{REC.mr.stop();}catch(e){} }
  REC.on=false; if(btn){btn.classList.remove('on');btn.textContent='● REC';}}

}

/* pixel-level camera filters */
function applyFilter(g,w,h,f){
  const W=g.canvas.width,H=g.canvas.height;
  let img;try{img=g.getImageData(0,0,W,H);}catch(e){return;}
  const d=img.data;
  for(let i=0;i<d.length;i+=4){
    const r=d[i],gr=d[i+1],b=d[i+2];
    const lum=(r*.299+gr*.587+b*.114);
    switch(f){
      case 'thermal':{const t=lum/255;
        let R,G,B;
        if(t<.25){R=0;G=0;B=t*4*200;}
        else if(t<.5){R=0;G=(t-.25)*4*255;B=200-(t-.25)*4*200;}
        else if(t<.75){R=(t-.5)*4*255;G=255;B=0;}
        else{R=255;G=255-(t-.75)*4*200;B=(t-.75)*4*255;}
        d[i]=R;d[i+1]=G;d[i+2]=B;break;}
      case 'night':{const v=clamp(lum*1.9,0,255);d[i]=v*.25;d[i+1]=v;d[i+2]=v*.3;break;}
      case 'neg':d[i]=255-r;d[i+1]=255-gr;d[i+2]=255-b;break;
      case 'red':{const v=clamp(lum*1.5,0,255);d[i]=v;d[i+1]=v*.12;d[i+2]=v*.12;break;}
      case 'uv':{d[i]=clamp(b*1.3+lum*.3,0,255);d[i+1]=clamp(lum*.2,0,255);d[i+2]=clamp(r*1.1+120,0,255);break;}
      case 'mono':{const v=clamp((255-lum)*1.1,0,255);d[i]=d[i+1]=d[i+2]=v;break;}
      case 'pred':{const t=lum/255;d[i]=clamp(Math.sin(t*6.28)*127+128,0,255);
        d[i+1]=clamp(Math.sin(t*6.28+2)*127+128,0,255);d[i+2]=clamp(Math.sin(t*6.28+4)*127+128,0,255);break;}
      case 'xray':{const v=255-clamp(lum*1.4,0,255);d[i]=v*.7;d[i+1]=v*.85;d[i+2]=v;break;}
      case 'aurora':{const t=lum/255;d[i]=clamp(t*80,0,255);d[i+1]=clamp(t*255,0,255);
        d[i+2]=clamp(120+t*100,0,255);break;}
      case 'multispec':{const t=lum/255; // visible-light false-colour band split (not real EM/IR sensing)
        d[i]=clamp(Math.sin(t*3.14159)*255,0,255);
        d[i+1]=clamp(Math.sin(t*3.14159+2.1)*255,0,255);
        d[i+2]=clamp(Math.sin(t*3.14159+4.2)*255,0,255);break;}
    }
  }
  if(f==='edge'){edgeSobel(d,W,H);}
  g.putImageData(img,0,0);
}
function edgeSobel(d,W,H){
  const gray=new Float32Array(W*H);
  for(let i=0;i<W*H;i++)gray[i]=d[i*4]*.299+d[i*4+1]*.587+d[i*4+2]*.114;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=-gray[i-W-1]-2*gray[i-1]-gray[i+W-1]+gray[i-W+1]+2*gray[i+1]+gray[i+W+1];
    const gy=-gray[i-W-1]-2*gray[i-W]-gray[i-W+1]+gray[i+W-1]+2*gray[i+W]+gray[i+W+1];
    const m=clamp(Math.hypot(gx,gy),0,255),o=i*4;
    d[o]=m*.1;d[o+1]=m;d[o+2]=m*.6;}
}

  function ping(){
    rings.push({r:0,a:1});$('#snv',p).textContent='ping @ '+freqLabel(S.freqHz);
    if(S.audioReady===true&&S.audioCtx){const o=S.audioCtx.createOscillator(),gn=S.audioCtx.createGain();
      o.frequency.value=clamp(1800,20,20000);o.connect(gn);gn.connect(S.audioCtx.destination);

    g.strokeStyle='rgba(224,16,32,.9)';g.lineWidth=1.6*DPR;g.beginPath();

      if(lit){const al=clamp(1-(now-d.sonarLit)/2400,0,1);

      g.strokeStyle=`rgba(224,16,32,${.45*L.al})`;g.lineWidth=1*DPR;
      g.beginPath();g.moveTo(L.x,L.y);g.lineTo(lx<L.x?lx+tw:lx,ly);g.stroke();
      g.fillStyle=`rgba(255,255,255,${.3+.65*L.al})`;g.fillText(L.text,lx,ly);}
    g.fillStyle='rgba(224,16,32,.95)';g.beginPath();g.arc(cx,cy,4*DPR,0,7);g.fill();
  };

  const cv=$('#mc',p),g=cv.getContext('2d');
  let nodes=[],links=[];
  function build(){
    nodes=[{id:'GATEWAY',x:.5,y:.5,fixed:true,k:'gw'}];
    S.devices.forEach((d,i)=>{const a=i/S.devices.length*6.28;
      nodes.push({id:d.mac.slice(-8),mac:d.mac,x:.5+Math.cos(a)*.3,y:.5+Math.sin(a)*.3,
        vx:0,vy:0,k:d.type,rssi:d.rssi,vendor:d.vendor});});
    links=[];for(let i=1;i<nodes.length;i++){links.push([0,i]);
      if(Math.random()<.4&&i>1)links.push([i,1+((Math.random()*(nodes.length-1))|0)]);}
  }
  build();setInterval(build,6000);
  cv.addEventListener('pointerdown',e=>{const r=cv.getBoundingClientRect();
    const px=(e.clientX-r.left)/r.width,py=(e.clientY-r.top)/r.height;
    let best=null,bd=1;for(const n of nodes){const dd=Math.hypot(n.x-px,n.y-py);if(dd<bd&&dd<.06){bd=dd;best=n;}}
    if(best)showPop(e.clientX,e.clientY,best.k==='gw'?'GATEWAY':'MESH NODE',[

    // simple force

      for(let j=1;j<nodes.length;j++)if(i!==j){const o=nodes[j];let dx=n.x-o.x,dy=n.y-o.y,d=Math.hypot(dx,dy)+.001;
        const f=.0004/(d*d);n.vx+=dx/d*f;n.vy+=dy/d*f;}
      const dx=.5-n.x,dy=.5-n.y;n.vx+=dx*.002;n.vy+=dy*.002;
      n.x=clamp(n.x+n.vx,.06,.94);n.y=clamp(n.y+n.vy,.08,.92);}
    g.lineWidth=1*devicePixelRatio;

definePage('sound','SOUND',IC.sound,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Sound Analysis</h2><span class="sub">scope · spectrum · waveform ID</span>
    <div class="sp"></div><button class="btn" id="sdEn">🎙 MIC OFF</button></div>
    <div class="grow"><canvas id="sdc" data-pt="sd"></canvas>
      <div class="legend" id="sdwave">waveform: —</div>
      <div class="mini" id="sdv">level —</div></div>`;
  const btn=$('#sdEn',p);
  btn.onclick=async()=>{
    if(S.audioReady===true){ // turn mic OFF
      if(S.audioCtx){try{S.audioCtx.close();}catch(e){}} S.audioReady=false;S.analyser=null;
      $('#pMic').className='pill';$('#pMic').textContent='MIC ○';btn.classList.remove('on');btn.textContent='🎙 MIC OFF';
    } else { const ok=await initAudio(); btn.classList.toggle('on',S.audioReady===true);
      btn.textContent=S.audioReady===true?'🎙 MIC ON':'🎙 MIC OFF'; }
  };
  const cv=$('#sdc',p),g=cv.getContext('2d');
  // classify the dominant live waveform shape from the time-domain buffer
  function classifyWave(){
    if(S.audioReady!==true||!S.timeData)return '—';
    const N=S.timeData.length;let sum=0,sumsq=0,peak=0,zc=0,prev=0;
    for(let i=0;i<N;i++){const v=(S.timeData[i]-128)/128;sum+=Math.abs(v);sumsq+=v*v;
      if(Math.abs(v)>peak)peak=Math.abs(v);if(i&&((v>=0)!==(prev>=0)))zc++;prev=v;}
    if(peak<0.03)return 'silent';
    const rms=Math.sqrt(sumsq/N), crest=peak/(rms||1e-6), form=(sum/N)/(rms||1e-6);
    // crest factor: sine≈1.41, square≈1.0, triangle≈1.73, noise/voice high & irregular
    if(crest<1.2) return 'square / clipped';
    if(crest<1.55) return 'sine (pure tone)';
    if(crest<1.9) return 'triangle / sawtooth';
    if(form<0.6) return 'impulsive / percussive';
    return 'complex / voice / noise';
  }
  p.draw=()=>{const w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio;
    g.fillStyle='#0e0e12';g.fillRect(0,0,w,h);const mid=h*.42;
    const bw=w/S.bands.length;for(let b=0;b<S.bands.length;b++){const v=S.bands[b];
      g.fillStyle=heatColor(v);g.fillRect(b*bw,h-v*(h*.5),bw-1,v*(h*.5));}
    g.strokeStyle='rgba(255,42,58,.9)';g.lineWidth=1.4*devicePixelRatio;g.beginPath();
    if(S.audioReady===true&&S.timeData){for(let i=0;i<S.timeData.length;i++){
      const x=i/S.timeData.length*w;const y=mid+((S.timeData[i]-128)/128)*(h*.3);i?g.lineTo(x,y):g.moveTo(x,y);}}
    else{for(let i=0;i<w;i+=2){const y=mid+Math.sin(i*.05+performance.now()/200)*S.micLevel*h*.3;i?g.lineTo(i,y):g.moveTo(i,y);}}
    g.stroke();
    g.strokeStyle='rgba(255,42,58,.15)';g.beginPath();g.moveTo(0,mid);g.lineTo(w,mid);g.stroke();
    $('#sdwave',p).textContent='waveform: '+classifyWave();
    $('#sdv',p).textContent=`level ${fmt(S.micLevel*100,0)}%  peak ${fmt(S.micPeak*100,0)}%  ${S.audioReady===true?'LIVE':'off'}`;
  };
});

definePage('gen','GENERATOR',IC.gen,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Waveform Generator</h2><span class="sub">acoustic 20Hz–20kHz · real output</span>
    <div class="sp"></div><button class="btn danger" id="gPlay">▶ EMIT</button></div>
    <div class="grow"><canvas id="gc" data-pt="g"></canvas>
      <div class="legend" id="glg">—</div>
      <div class="mini warn">Phone hardware emits sound only. RF/GHz &amp; 6G are not physically possible from a handset — see notes.</div></div>
    <div class="ctrls" style="flex-direction:column;align-items:stretch">
      <div id="gwf" style="display:flex;gap:5px;flex-wrap:wrap"></div>
      <label class="sl" style="width:100%;margin-top:6px">FREQ <input id="gfr" type="range" min="20" max="20000" value="440"> <b id="gfv" style="color:var(--cyan2);min-width:64px">440 Hz</b></label>
      <label class="sl" style="width:100%">VOL <input id="gvl" type="range" min="0" max="100" value="22"> <b id="gvv" style="min-width:40px">22%</b></label>

    </div>`;
  const waves=[['Sine','sine'],['Square','square'],['Triangle','triangle'],['Sawtooth','sawtooth'],
    ['Gaussian Pulse','gauss'],['Raised Cosine','rcos'],['Preamble Burst','preamble'],['NDP Null','ndp']];
  let wf='sine',vol=.22,freq=440,osc=null,gain=null,playing=false,bursting=null;
  const gwf=$('#gwf',p);
  waves.forEach(([n,v])=>{const b=el('button','btn'+(v===wf?' on':''),n);
    b.onclick=()=>{wf=v;[...gwf.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');if(playing)retune();};gwf.appendChild(b);});
  $('#gfr',p).oninput=e=>{freq=+e.target.value;$('#gfv',p).textContent=freqLabel(freq);if(playing)retune();};
  $('#gvl',p).oninput=e=>{vol=+e.target.value/100;$('#gvv',p).textContent=e.target.value+'%';
    if(gain)gain.gain.value=vol;};
  // burst/packet modes
  const gb=$('#gburst',p);
  [['Single','single'],['Burst ×8','b8'],['Chirp','chirp'],['Preamble+NDP','pre']].forEach(([n,m])=>{
    const b=el('button','btn',n);b.onclick=()=>fireBurst(m);gb.appendChild(b);});
  function makeOsc(){const ctx=S.audioCtx;osc=ctx.createOscillator();gain=ctx.createGain();
    gain.gain.value=vol;osc.connect(gain);gain.connect(ctx.destination);
    osc.type=(wf==='gauss'||wf==='rcos'||wf==='preamble'||wf==='ndp')?'sine':wf;osc.frequency.value=clamp(freq,20,20000);}
  function retune(){if(osc){osc.type=(wf==='gauss'||wf==='rcos'||wf==='preamble'||wf==='ndp')?'sine':wf;
    osc.frequency.setValueAtTime(clamp(freq,20,20000),S.audioCtx.currentTime);}}
  $('#gPlay',p).onclick=async()=>{await initAudio();if(S.audioReady!==true){toast('Need mic/audio permission to emit');return;}
    if(playing){osc&&osc.stop();playing=false;$('#gPlay',p).classList.remove('on');$('#gPlay',p).textContent='▶ EMIT';return;}
    makeOsc();osc.start();playing=true;$('#gPlay',p).classList.add('on');$('#gPlay',p).textContent='■ STOP';};
  async function fireBurst(mode){await initAudio();if(S.audioReady!==true)return;
    const ctx=S.audioCtx,now=ctx.currentTime;
    const env=(o,g,t0,dur,shape)=>{g.gain.setValueAtTime(.0001,t0);
      if(shape==='gauss'){g.gain.exponentialRampToValueAtTime(vol,t0+dur*.5);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);}
      else{g.gain.exponentialRampToValueAtTime(vol,t0+.004);g.gain.setValueAtTime(vol,t0+dur-.004);g.gain.exponentialRampToValueAtTime(.0001,t0+dur);}
      o.start(t0);o.stop(t0+dur);};
    const mk=(f,t0,dur,shape)=>{const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=clamp(f,20,20000);o.connect(g);g.connect(ctx.destination);env(o,g,t0,dur,shape);};
    if(mode==='single')mk(freq,now,.15,wf==='gauss'?'gauss':'flat');
    else if(mode==='b8')for(let i=0;i<8;i++)mk(freq,now+i*.09,.05,'flat');
    else if(mode==='chirp'){const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';
      o.frequency.setValueAtTime(clamp(freq,20,20000),now);o.frequency.exponentialRampToValueAtTime(clamp(freq*4,20,20000),now+.4);
      o.connect(g);g.connect(ctx.destination);env(o,g,now,.45,'flat');}
    else if(mode==='pre'){ // "preamble + NDP" acoustic analogue
      for(let i=0;i<4;i++)mk(freq,now+i*.05,.03,'flat'); // short training symbols
      mk(freq*1.5,now+.26,.02,'gauss'); // null data packet marker
    }
    toast('Emitted '+mode+' @ '+freqLabel(freq));
  }
  const cv=$('#gc',p),g=cv.getContext('2d');let ph=0;
  p.draw=()=>{const w=cv.width=cv.clientWidth*devicePixelRatio,h=cv.height=cv.clientHeight*devicePixelRatio;
    g.fillStyle='#0e0e12';g.fillRect(0,0,w,h);const mid=h/2;
    g.strokeStyle='rgba(255,42,58,.12)';g.beginPath();g.moveTo(0,mid);g.lineTo(w,mid);g.stroke();
    g.strokeStyle='rgba(255,42,58,.95)';g.lineWidth=1.8*devicePixelRatio;g.beginPath();
    ph+=.04;const cycles=6;
    for(let x=0;x<w;x++){const t=x/w*cycles*Math.PI*2+ph;let y;
      switch(wf){
        case 'square':y=Math.sign(Math.sin(t));break;
        case 'triangle':y=2/Math.PI*Math.asin(Math.sin(t));break;
        case 'sawtooth':y=((t/Math.PI)%2)-1;break;
        case 'gauss':{const u=((x/w)*6-3);y=Math.exp(-u*u/.4)*Math.sin(t*2);break;}
        case 'rcos':{const u=(x/w);y=.5*(1-Math.cos(2*Math.PI*u))*Math.sin(t);break;}
        case 'preamble':{const seg=(x/w*8|0)%2;y=seg*Math.sin(t*2);break;}
        case 'ndp':{y=(x/w>.4&&x/w<.44)?0:Math.sin(t)*.15;break;}
        default:y=Math.sin(t);}
      const py=mid-y*h*.34;x?g.lineTo(x,py):g.moveTo(x,py);}
    g.stroke();
    $('#glg',p).innerHTML=`${wf} · ${freqLabel(freq)}<br>${playing?'<span class="sig">EMITTING</span>':'idle'}`;
  };
});

/* ================================================================
   SDR BRIDGE — RTL-SDR (WebUSB) / HackRF·Pi·AWS (WebSocket)
   On-device FFT turns incoming IQ into the live spectrum.
   ================================================================ */
function fft(re,im){ // in-place iterative radix-2 (n = power of 2)
  const n=re.length;
  for(let i=1,j=0;i<n;i++){let bit=n>>1;for(;j&bit;bit>>=1)j^=bit;j^=bit;
    if(i<j){const tr=re[i];re[i]=re[j];re[j]=tr;const ti=im[i];im[i]=im[j];im[j]=ti;}}
  for(let len=2;len<=n;len<<=1){const a=-2*Math.PI/len,wr=Math.cos(a),wi=Math.sin(a);
    for(let i=0;i<n;i+=len){let cr=1,ci=0;
      for(let k=0;k<len>>1;k++){const ur=re[i+k],ui=im[i+k];
        const xr=re[i+k+(len>>1)],xi=im[i+k+(len>>1)];
        const vr=xr*cr-xi*ci,vi=xr*ci+xi*cr;
        re[i+k]=ur+vr;im[i+k]=ui+vi;re[i+k+(len>>1)]=ur-vr;im[i+k+(len>>1)]=ui-vi;
        const ncr=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=ncr;}}}
}
function iqToBands(buf){ // interleaved u8 I,Q (bias 127.5) → power spectrum into S.bands
  const N=1024; if(buf.length<2*N)return;
  const re=new Float32Array(N),im=new Float32Array(N);
  for(let i=0;i<N;i++){const w=0.5-0.5*Math.cos(2*Math.PI*i/(N-1));
    re[i]=((buf[2*i]-127.5)/127.5)*w; im[i]=((buf[2*i+1]-127.5)/127.5)*w;}
  fft(re,im);
  const bn=S.bands.length;
  for(let b=0;b<bn;b++){const src=(((b/bn)*N)+(N>>1))%N|0; // fftshift → DC centered
    const mag=Math.hypot(re[src],im[src])/N; const db=20*Math.log10(mag+1e-9);
    S.bands[b]=S.bands[b]*0.3+clamp((db+70)/70,0,1)*0.7;}
  S.bridgeLive=true;S.bridgeTS=performance.now();
}
function hash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return h;}

const BRIDGE={
  ws:null,usb:null,mode:'none',log:[],pill:null,
  init(){this.pill=el('span','pill','LINK ○');const f=$('#pFreq');if(f)f.before(this.pill);},

  onMessage(data){

  setDevices(list){const seen=new Set();

      const rr=r.r!=null?r.r:clamp(((r.rssi!=null?r.rssi:-70)+99)/74,.1,.96);
      if(!d){S.devices.push({mac,ang,r:rr,rssi:r.rssi!=null?r.rssi:-70,ch:r.ch!=null?r.ch:'-',
        band:r.band||'2.4G',type:r.type||'RF',vendor:r.vendor||'ext',ext:true,
        moving:false,still:99,speed:0,trail:[],px:ang,pr:rr,moveUntil:0,tAng:ang,tR:rr});}
      else{if(r.rssi!=null)d.rssi=r.rssi;if(r.ch!=null)d.ch=r.ch;if(r.band)d.band=r.band;
        if(r.type)d.type=r.type;if(r.vendor)d.vendor=r.vendor;d.ext=true;
        if(r.ang!=null)d.ang=r.ang;if(r.r!=null)d.r=r.r;}}
    S.devices=S.devices.filter(d=>!d.ext||seen.has(d.mac));},
  send(obj){if(this.ws&&this.ws.readyState===1){this.ws.send(JSON.stringify(obj));
      this.logLine('▸ '+(obj.cmd||obj.t||'msg')+' '+JSON.stringify(obj).slice(0,60));return true;}
    toast('No live bridge — command not sent');this.logLine('✕ not linked: '+(obj.cmd||'cmd'));return false;},
  async connectUSB(){if(!('usb'in navigator)){toast('WebUSB not supported here (use Android Chrome)');return;}
    try{const dev=await navigator.usb.requestDevice({filters:[{vendorId:0x0bda}]});
      await dev.open();if(dev.configuration===null)await dev.selectConfiguration(1);
      await dev.claimInterface(0);this.usb=dev;this.mode='usb';
      this.setStatus(true,'USB');this.logLine('USB claimed '+(dev.productName||dev.productId));
      toast('RTL-SDR claimed (experimental) — streaming IQ');this.readUSB(dev);
    }catch(e){this.logLine('USB '+(e.message||e.name));toast('USB: '+(e.message||e.name));}},
  async readUSB(dev){const EP=1; // bulk IN; RTL2832U tuner init varies — WS bridge is the robust path
    while(this.usb===dev){try{const r=await dev.transferIn(EP,16384);
        if(r.data&&r.data.byteLength)iqToBands(new Uint8Array(r.data.buffer));
        else await new Promise(res=>setTimeout(res,30));
      }catch(e){this.logLine('USB read end: '+(e.message||e.name));break;}}},
  disconnect(){if(this.ws){try{this.ws.close();}catch(e){}this.ws=null;}
    if(this.usb){try{this.usb.close();}catch(e){}this.usb=null;}
    this.mode='none';S.bridgeLive=false;this.setStatus(false);},
};

definePage('sky','SKY',`<svg viewBox="0 0 24 24"><circle class="fill" cx="12" cy="12" r="3"/><path class="stroke" d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M18.4 5.6L17 7M7 17l-1.4 1.4"/><circle class="fill" cx="19" cy="5" r="1"/><circle class="fill" cx="5" cy="18" r="1"/></svg>`,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Sky · Sat · Sun</h2><span class="sub">point up · AR overlay</span>
    <div class="sp"></div><button class="btn" id="skyEn">◉ ENABLE</button></div>
    <div class="grow"><canvas id="skc" data-pt="sk"></canvas><div class="legend" id="sklg">—</div>
      <div class="mini" id="skv">tap ENABLE (needs location + motion)</div></div>`;
  $('#skyEn',p).onclick=async()=>{await armAll();geoNow(()=>{});$('#skyEn',p).classList.add('on');};
  const cv=$('#skc',p),g=cv.getContext('2d');
  p.draw=()=>{const DPR=devicePixelRatio,w=cv.width=cv.clientWidth*DPR,h=cv.height=cv.clientHeight*DPR;
    g.fillStyle='#05060a';g.fillRect(0,0,w,h);
    const lookAz=S.heading, lookEl=clamp((S.pitch||0)-90,-90,90);
    const ppd=w/70;                              // ~70° field of view
    const cx=w/2,cy=h/2;
    // horizon + reticle
    const hy=cy+lookEl*ppd; g.strokeStyle='rgba(255,42,58,.3)';g.lineWidth=1*DPR;
    g.beginPath();g.moveTo(0,hy);g.lineTo(w,hy);g.stroke();
    g.fillStyle='rgba(180,180,186,.6)';g.font=(9*DPR)+'px monospace';g.textAlign='center';g.fillText('HORIZON',cx,hy-4*DPR);
    g.strokeStyle='rgba(255,42,58,.5)';g.beginPath();g.moveTo(cx-14*DPR,cy);g.lineTo(cx+14*DPR,cy);
    g.moveTo(cx,cy-14*DPR);g.lineTo(cx,cy+14*DPR);g.stroke();
    if(!S.pos){$('#skv',p).textContent='need location — tap ENABLE, accept GPS';return;}
    const now=new Date(),objs=[];
    const sun=sunRaDec(now),sp=altaz(sun.ra,sun.dec,S.pos.lat,S.pos.lon,now);
    objs.push({n:'☀ Sun',az:sp.az,el:sp.alt,c:'#ffb020',r:9});
    for(const[n,rah,dec] of STARS){const aa=altaz(rah*15,dec,S.pos.lat,S.pos.lon,now);
      if(aa.alt>-5)objs.push({n,az:aa.az,el:aa.alt,c:'#ffffff',r:3});}
    for(const[n,lonS] of GEOSATS){const s=geoSat(lonS,S.pos.lat,S.pos.lon);
      if(s.el>-2)objs.push({n:'🛰 '+n,az:s.az,el:s.el,c:'#38c0ff',r:4,dist:s.dist});}
    g.textAlign='left';
    let shown=0;
    for(const o of objs){const dx=angDiff(o.az,lookAz)*ppd, dy=-(o.el-lookEl)*ppd;
      const x=cx+dx,y=cy+dy;if(x<-40||x>w+40||y<-40||y>h+40)continue;shown++;
      g.fillStyle=o.c;g.beginPath();g.arc(x,y,o.r*DPR,0,7);g.fill();
      g.fillStyle='rgba(235,235,240,.9)';g.font=(9*DPR)+'px monospace';
      g.fillText(o.n+'  '+fmt(o.el,0)+'°',x+o.r*DPR+4*DPR,y+3*DPR);}
    const st=sunTimes(now,S.pos.lat,S.pos.lon);
    const tt=d=>d?d.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):'—';
    $('#sklg',p).innerHTML=`look ${fmt(lookAz,0)}°az ${fmt(lookEl,0)}°el<br>${shown} objects`;
    $('#skv',p).innerHTML=st.polar?('polar '+st.polar):`☀ ${fmt(sp.alt,0)}° &nbsp; ↑${tt(st.rise)} &nbsp; ↓${tt(st.set)}`;
  };
});

definePage('deter','DETER',`<svg viewBox="0 0 24 24"><path class="stroke" d="M8 10a4 4 0 018 0v4l1.5 2.5h-11L8 14z"/><path class="stroke" d="M10 19a2 2 0 004 0"/><path class="fill" d="M12 3a1 1 0 011 1v1h-2V4a1 1 0 011-1z"/></svg>`,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Wildlife Deterrent</h2><span class="sub">noisemaker · announce presence</span>
    <div class="sp"></div><button class="btn danger" id="dStop">■ STOP</button></div>
   <div class="grow scroll" style="padding:10px;display:flex;flex-direction:column;gap:9px">
     <div class="bcard" style="border-color:rgba(255,176,32,.5)"><div class="bnote" style="color:var(--amber)">⚠ Noise helps you <b>avoid surprising</b> wildlife — the single best way to prevent an encounter. It is not a guaranteed repellent. Carry bear spray; never run. Species guidance below.</div></div>
     <div class="bcard"><div class="btitle">Species</div><div class="brow" id="dsp"></div>
       <div class="bnote" id="dadvice">—</div></div>
     <div class="bcard"><div class="btitle">Noisemaker · frequency profiles</div>

       <div class="brow" style="align-items:center">
         <button class="btn on" id="dMute">🔊 ON</button>
         <button class="btn" id="dVdn">VOL −</button><button class="btn" id="dVup">VOL +</button>
         <span class="chip">VOL <b id="dvv">70</b>%</span></div>
       <label class="sl">INTERVAL <input id="dint" type="range" min="300" max="4000" step="100" value="1400"><b id="dintv">1.4s</b></label>
       <div class="bnote">Different animals react to different pitches — low booms carry far, high whistles pierce. Loop repeats until STOP or 🔇.</div>
     </div></div>`;
  const ADV={bear:'BEAR (black/grizzly): talk loudly, group up, don\'t run. If charged by a grizzly, play dead (face down, protect neck); fight back against a black bear. Bear spray at 30–60 ft.',
    lion:'MOUNTAIN LION (Roosevelt NF): do NOT run or crouch. Face it, look big, raise arms/jacket, shout. Throw objects. Pick up kids. Fight back if attacked — aim for eyes/face.',
    moose:'MOOSE: more dangerous than it looks. Back away, put a tree/car between you. If it charges, run and get behind cover. Watch for lowered head, raised hackles, licking lips.',
    wolf:'WOLF: rare to attack. Stand tall, be loud and assertive, maintain eye contact, back away slowly. Do not run. Throw rocks/sticks if approached.'};
  let species='bear',ctx=null,master=null,muted=false,vol=.7,interval=1400,loopT=null;
  function octx(){if(!ctx){ctx=new (window.AudioContext||window.webkitAudioContext)();
    master=ctx.createGain();master.gain.value=muted?0:vol;master.connect(ctx.destination);}return ctx;}
  function applyVol(){if(master)master.gain.value=muted?0:vol;const v=$('#dvv',p);if(v)v.textContent=Math.round(vol*100);}
  const dsp=$('#dsp',p);
  [['🐻 Bear','bear'],['🦁 Lion','lion'],['🫎 Moose','moose'],['🐺 Wolf','wolf']].forEach(([n,v])=>{
    const b=el('button','btn'+(v==='bear'?' on':''),n);b.onclick=()=>{species=v;
      [...dsp.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');$('#dadvice',p).textContent=ADV[v];};dsp.appendChild(b);});
  $('#dadvice',p).textContent=ADV.bear;
  $('#dint',p).oninput=e=>{interval=+e.target.value;$('#dintv',p).textContent=(interval/1000).toFixed(1)+'s';};
  function tone(cfg){const c=octx(),t=c.currentTime;cfg.freqs.forEach(f=>{const o=c.createOscillator(),gn=c.createGain();
    o.type=cfg.type||'sine';o.frequency.setValueAtTime(f,t);if(cfg.sweepTo)o.frequency.linearRampToValueAtTime(cfg.sweepTo,t+cfg.dur);
    if(cfg.vib){const lfo=c.createOscillator(),lg=c.createGain();lfo.frequency.value=cfg.vib;lg.gain.value=f*0.07;
      lfo.connect(lg);lg.connect(o.frequency);lfo.start(t);lfo.stop(t+cfg.dur);}
    o.connect(gn);gn.connect(master);gn.gain.setValueAtTime(0.0001,t);
    gn.gain.exponentialRampToValueAtTime(cfg.gain||0.6,t+0.01);
    gn.gain.setValueAtTime(cfg.gain||0.6,t+cfg.dur-0.06);gn.gain.exponentialRampToValueAtTime(0.0001,t+cfg.dur);
    o.start(t);o.stop(t+cfg.dur+0.03);});}
  const SND={
    boom:['💥 Low boom',()=>tone({freqs:[110],type:'sine',dur:0.7,gain:0.95})],
    bell:['🔔 Bell',()=>tone({freqs:[880,1318,1760],type:'sine',dur:0.8,gain:0.5})],
    siren:['🚨 Siren',()=>tone({freqs:[700],type:'sawtooth',dur:0.9,gain:0.55,sweepTo:1600})],
    whistle:['📣 Whistle 3k',()=>tone({freqs:[3000],type:'sine',dur:0.5,gain:0.5})],
    horn:['📢 Air-horn',()=>tone({freqs:[420],type:'sawtooth',dur:0.8,gain:0.55,vib:6})],
    growl:['🐾 Growl 90Hz',()=>tone({freqs:[90,180],type:'sawtooth',dur:0.8,gain:0.85,vib:4})],
  };
  const ds=$('#dsounds',p);
  Object.entries(SND).forEach(([k,[label,fn]])=>{const b=el('button','btn',label);
    b.onclick=()=>{startRepeat(fn);[...ds.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');};ds.appendChild(b);});
  function startRepeat(fn){stopLoop();octx();applyVol();fn();loopT=setInterval(fn,interval);toast('Deterrent active');}
  function stopLoop(){if(loopT){clearInterval(loopT);loopT=null;}[...ds.children].forEach(c=>c.classList.remove('on'));}
  $('#dShout',p).onclick=()=>{if(muted)return;const msg=species==='bear'?'Hey bear! Coming through!':'Hey! Human here! Coming through!';

  $('#dVdn',p).onclick=()=>{vol=clamp(vol-0.1,0,1);applyVol();};
  $('#dStop',p).onclick=()=>{stopLoop();if('speechSynthesis'in window)speechSynthesis.cancel();toast('Stopped');};
  p.onHide=()=>{stopLoop();if('speechSynthesis'in window)speechSynthesis.cancel();};
});

    <div class="sp"></div><button class="btn" id="fcap">📷 PHOTO</button></div>
   <div class="grow scroll" style="padding:10px;display:flex;flex-direction:column;gap:9px">
     <div class="bcard"><div class="brow" id="fcat"></div>
       <div class="bnote">Observe features and narrow the list. This is an honest field key for the Colorado Front Range / Roosevelt NF — not a photo auto-ID.</div></div>

  const fcat=$('#fcat',p);
  Object.keys(FIELD).forEach(k=>{const b=el('button','btn'+(k===cat?' on':''),FIELD[k].title.split(' ')[0]);
    b.onclick=()=>{cat=k;sel={};[...fcat.children].forEach(c=>c.classList.remove('on'));b.classList.add('on');renderFilt();};fcat.appendChild(b);});
  function renderFilt(){const f=$('#ffilt',p);f.innerHTML='';const def=FIELD[cat];

    def.filters.forEach(([label,key,opts])=>{const s=el('select','');

      s.onchange=()=>{sel[key]=s.value==='any'?null:s.value;renderRes();};f.appendChild(s);});

  function renderRes(){const r=$('#fres',p);const def=FIELD[cat];
    const m=def.items.filter(it=>Object.entries(sel).every(([k,v])=>!v||it[k]===v));

  function renderFinds(){const l=$('#flist',p),a=loadFinds();

      <span style="color:var(--grey)">${f.lat?f.lat.toFixed(4)+','+f.lon.toFixed(4):'no GPS'} · ${new Date(f.t).toLocaleString()}</span></div>
      ${f.lat?`<a class="btn" target="_blank" rel="noopener" href="https://maps.google.com/?q=${f.lat},${f.lon}">🗺</a>`:''}

definePage('listen','LISTEN',`<svg viewBox="0 0 24 24"><path class="stroke" d="M4 12h2l2-6 3 14 3-18 2 10h4"/></svg>`,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Wildlife Listen</h2><span class="sub">spectrogram · call features</span>
    <div class="sp"></div><button class="btn" id="lMic">🎙 MIC</button><button class="btn danger" id="lRec">● REC</button></div>
    <div class="grow"><canvas id="lc" data-pt="l"></canvas><div class="legend" id="lfeat">—</div></div>
    <div class="ctrls" style="flex-direction:column;align-items:stretch">
      <div class="bnote">Measures pitch, rhythm and brightness of a call. Honest limit: real species ID needs a trained model (e.g. BirdNET) and animal emotion is not phone-measurable — compare the numbers to the reference below.</div>
      <div class="bnote" style="color:#fff">Coyote yip ~400–1000 Hz, fast · Owl hoot ~300–600 Hz, slow · Elk bugle rises to 1–2 kHz · Wolf howl ~150–780 Hz, sustained · Songbird ~2–8 kHz.</div>
      <div class="btitle" style="color:var(--red);font-size:11px;margin-top:4px">DTMF / Radio tones &nbsp;<span id="dtmfdec" style="color:#38c0ff">decode: —</span></div>
      <div id="dtmfpad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px"></div>
      <div class="bnote">Hold the speaker to your Baofeng/HT mic to SEND repeater tones; point the mic at the radio to DECODE incoming DTMF. This is acoustic DTMF — not CHIRP cable programming (that needs a USB programming cable).</div>
    </div>`;
  const LOW=[697,770,852,941],HIGH=[1209,1336,1477,1633];
  const KEYS=[['1','2','3','A'],['4','5','6','B'],['7','8','9','C'],['*','0','#','D']];
  function octx(){return S._octx||(S._octx=new (window.AudioContext||window.webkitAudioContext)());}
  function dtmfSend(key){let lo=-1,hi=-1;KEYS.forEach((row,r)=>row.forEach((k,c)=>{if(k===key){lo=r;hi=c;}}));
    if(lo<0)return;const c=octx(),t=c.currentTime;[LOW[lo],HIGH[hi]].forEach(f=>{const o=c.createOscillator(),gn=c.createGain();
      o.type='sine';o.frequency.value=f;o.connect(gn);gn.connect(c.destination);gn.gain.value=0.3;
      o.start(t);o.stop(t+0.25);});}
  function goertzel(buf,sr,freq){const N=buf.length,k=Math.round(N*freq/sr),w=2*Math.PI*k/N,coeff=2*Math.cos(w);
    let s1=0,s2=0;for(let i=0;i<N;i++){const x=(buf[i]-128)/128,s0=coeff*s1-s2+x;s2=s1;s1=s0;}
    return s1*s1+s2*s2-coeff*s1*s2;}
  const pad=$('#dtmfpad',p);KEYS.flat().forEach(k=>{const b=el('button','btn',k);b.style.padding='8px 0';
    b.onclick=()=>{dtmfSend(k);};pad.appendChild(b);});
  $('#lMic',p).onclick=async()=>{await initAudio();$('#lMic',p).classList.toggle('on',S.audioReady===true);};
  let mr=null,chunks=[];
  $('#lRec',p).onclick=async()=>{await initAudio();
    if(mr&&mr.state==='recording'){mr.stop();return;}
    if(!S.micStream){toast('Mic not ready');return;}
    try{const types=['audio/webm','audio/mp4'];const mt=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
      chunks=[];mr=new MediaRecorder(S.micStream,mt?{mimeType:mt}:undefined);
      mr.ondataavailable=e=>{if(e.data.size)chunks.push(e.data);};
      mr.onstop=()=>{const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
        saveFile('wildcall_'+Date.now()+((mr.mimeType||'').includes('mp4')?'.mp4':'.webm'),blob);
        $('#lRec',p).classList.remove('on');$('#lRec',p).textContent='● REC';};
      mr.start();$('#lRec',p).classList.add('on');$('#lRec',p).textContent='■ STOP';toast('Recording call…');
    }catch(e){toast('Record failed');}};
  function detectPitch(){if(S.audioReady!==true||!S.timeData)return 0;const b=S.timeData,N=b.length,sr=S.audioCtx.sampleRate;
    let rms=0;const f=new Float32Array(N);for(let i=0;i<N;i++){f[i]=(b[i]-128)/128;rms+=f[i]*f[i];}
    if(Math.sqrt(rms/N)<0.012)return 0;let best=0,off=-1;const MIN=(sr/1500)|0,MAX=(sr/80)|0;
    for(let o=MIN;o<=MAX;o++){let c=0;for(let i=0;i<N-o;i++)c+=f[i]*f[i+o];if(c>best){best=c;off=o;}}
    return off>0?sr/off:0;}
  const cv=$('#lc',p),g=cv.getContext('2d');let img=null,env=[];
  p.draw=()=>{const w=Math.round(cv.clientWidth*devicePixelRatio),h=Math.round(cv.clientHeight*devicePixelRatio);
    if(cv.width!==w||cv.height!==h){cv.width=w;cv.height=h;g.fillStyle='#0e0e12';g.fillRect(0,0,w,h);}
    const prev=g.getImageData(0,0,w,h-1);g.putImageData(prev,0,1);
    for(let x=0;x<w;x++){const v=S.bands[(x/w*S.bands.length)|0]||0;g.fillStyle=heatColor(v);g.fillRect(x,0,1,1);}
    env.push(S.micLevel);if(env.length>40)env.shift();
    let pulses=0;for(let i=2;i<env.length;i++)if(env[i]>0.18&&env[i-1]<=0.18)pulses++;
    const pitch=detectPitch();
    let bright=0;for(let b=0;b<S.bands.length;b++)bright+=S.bands[b]*b;bright/=(S.bands.length*(S.bands.reduce((a,c)=>a+c,0)||1));
    $('#lfeat',p).innerHTML=`pitch ~${pitch?Math.round(pitch):'—'} Hz · rhythm ${pulses}/win · ${bright>0.55?'bright/high':'low/warm'}`;
    if(S.audioReady===true&&S.timeData){const sr=S.audioCtx.sampleRate,buf=S.timeData;
      const lp=LOW.map(f=>goertzel(buf,sr,f)),hp=HIGH.map(f=>goertzel(buf,sr,f));
      const li=lp.indexOf(Math.max(...lp)),hi=hp.indexOf(Math.max(...hp));
      const avg=(lp.reduce((a,b)=>a+b,0)+hp.reduce((a,b)=>a+b,0))/8;
      if(lp[li]>avg*4&&hp[hi]>avg*4&&lp[li]>0.5&&hp[hi]>0.5)$('#dtmfdec',p).textContent='decode: '+KEYS[li][hi];}
  };
});

definePage('packet','PKT LAB',`<svg viewBox="0 0 24 24"><circle class="fill" cx="6" cy="6" r="1.4"/><circle class="fill" cx="12" cy="5" r="1.4"/><circle class="fill" cx="18" cy="7" r="1.4"/><circle class="fill" cx="5" cy="13" r="1.4"/><circle class="fill" cx="13" cy="12" r="1.4"/><circle class="fill" cx="19" cy="14" r="1.4"/><circle class="fill" cx="8" cy="19" r="1.4"/><circle class="fill" cx="16" cy="19" r="1.4"/><path class="stroke" d="M6 6l6-1 6 2M5 13l8-1 6 2" opacity=".4"/></svg>`,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Packet Lab</h2><span class="sub">CSI/LiDAR point-cloud sim</span>
    <div class="sp"></div><button class="btn danger" id="pkPulse">◉ PULSE</button></div>
    <div class="grow"><canvas id="pkc" data-pt="pk"></canvas><div class="mini" id="pkv">0 pts</div>
      <div class="legend">simulation + live CSI via bridge</div></div>
    <div class="ctrls" style="flex-direction:column;align-items:stretch">
      <label class="sl">DENSITY <input id="pkd" type="range" min="40" max="400" value="140"></label>
      <div class="brow"><button class="btn" id="pkAuto">AUTO BLOOM</button><button class="btn" id="pkClr">CLEAR</button>
        <button class="btn danger" id="pkTx">▸ SEND BLOOM (bridge)</button></div>
      <div class="bnote">Simulates how LiDAR-style spatial mapping emerges from dense packet pulses: rays from origin bounce off the target, floor, ceiling and XYZ bounds, and each return plots a point. Real CSI from your ESP32/SDR bridge feeds the same cloud.</div>
    </div>`;
  let pts=[],yaw=0,density=140,auto=false,autoT=null;
  $('#pkd',p).oninput=e=>density=+e.target.value;
  function pulse(){const n=density;for(let i=0;i<n;i++){
    const face=Math.random();let x,y,z;
    if(face<0.4){x=rnd(-1,1);z=rnd(-1,1);y=Math.random()<0.5?-1:1;}            // floor/ceiling
    else if(face<0.7){x=Math.random()<0.5?-1:1;y=rnd(-1,1);z=rnd(-1,1);}       // walls
    else{const t=rnd(0.3,0.9);const a=rnd(0,6.28),e2=rnd(-1,1);                 // target cluster near origin ray
      x=Math.cos(a)*0.3*t;y=e2*0.3;z=Math.sin(a)*0.3*t-0.2;}
    pts.push({x,y,z,a:1});}
    if(pts.length>2600)pts=pts.slice(pts.length-2600);
    if(S.motion&&performance.now()-S.motion.ts<500)for(const b of S.motion.blobs)
      pts.push({x:(b.cx-0.5)*2,y:(0.5-b.cy)*2,z:rnd(-0.3,0.3),a:1,hot:1});
  }
  $('#pkPulse',p).onclick=pulse;
  $('#pkAuto',p).onclick=e=>{auto=!auto;e.target.classList.toggle('on',auto);
    if(auto){autoT=setInterval(pulse,220);}else clearInterval(autoT);};
  $('#pkClr',p).onclick=()=>{pts=[];};
  $('#pkTx',p).onclick=()=>{if(BRIDGE.send({cmd:'bloom',count:density,ts:Date.now()}))toast('Packet bloom command sent to bridge');};
  const cv=$('#pkc',p),g=cv.getContext('2d');
  p.draw=()=>{const DPR=devicePixelRatio,w=cv.width=cv.clientWidth*DPR,h=cv.height=cv.clientHeight*DPR;
    g.fillStyle='rgba(5,5,8,.35)';g.fillRect(0,0,w,h);yaw+=0.004;const cx=w/2,cy=h/2,sc=Math.min(w,h)*0.32;
    const c=Math.cos(yaw),s=Math.sin(yaw);
    pts=pts.filter(pt=>{pt.a*=0.994;return pt.a>0.05;});
    for(const pt of pts){const x=pt.x*c-pt.z*s,z=pt.x*s+pt.z*c,pr=1/(2.4+z);
      const sx=cx+x*sc*pr*2.4,sy=cy+pt.y*sc*pr*2.4;
      g.fillStyle=pt.hot?`rgba(255,42,58,${pt.a})`:`rgba(235,235,240,${pt.a*0.8})`;
      g.fillRect(sx,sy,1.6*DPR,1.6*DPR);}
    // origin
    g.fillStyle='#ffb020';g.beginPath();g.arc(cx,cy,3*DPR,0,7);g.fill();
    $('#pkv',p).textContent=pts.length+' pts';
  };
});

   </div>`;
  const ans=$('#aska',p),qi=$('#askq',p);
  function search(){const q=qi.value.toLowerCase().trim();if(!q){ans.innerHTML='';return;}

const TILEDB={db:null};
function tdb(){return new Promise(res=>{try{const r=indexedDB.open('allalone_tiles',1);
  r.onupgradeneeded=()=>r.result.createObjectStore('t');r.onsuccess=()=>{TILEDB.db=r.result;res(r.result);};r.onerror=()=>res(null);}catch(e){res(null);}});}
async function tileGet(k){const db=await tdb();if(!db)return null;return new Promise(res=>{try{const q=db.transaction('t','readonly').objectStore('t').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null);}catch(e){res(null);}});}
async function tilePut(k,b){const db=await tdb();if(!db)return;try{db.transaction('t','readwrite').objectStore('t').put(b,k);}catch(e){}}
function lon2px(lon,z){return (lon+180)/360*256*(1<<z);}
function lat2py(lat,z){const s=Math.sin(lat*Math.PI/180);return (0.5-Math.log((1+s)/(1-s))/(4*Math.PI))*256*(1<<z);}
function px2lon(px,z){return px/(256*(1<<z))*360-180;}
function py2lat(py,z){const n=Math.PI-2*Math.PI*py/(256*(1<<z));return 180/Math.PI*Math.atan(0.5*(Math.exp(n)-Math.exp(-n)));}
const MAPLAYERS=[
 {id:'osm',name:'Street (OSM)',tpl:'https://tile.openstreetmap.org/{z}/{x}/{y}.png'},
 {id:'sat',name:'Satellite (Esri)',tpl:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'},
 {id:'topo',name:'Topo (OpenTopoMap)',tpl:'https://a.tile.opentopomap.org/{z}/{x}/{y}.png'},
 {id:'esritopo',name:'Topo (Esri)',tpl:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}'},
 {id:'terrain',name:'Terrain (Esri)',tpl:'https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}'},
 {id:'ocean',name:'Ocean (Esri)',tpl:'https://server.arcgisonline.com/ArcGIS/rest/services/Ocean/World_Ocean_Base/MapServer/tile/{z}/{y}/{x}'},
 {id:'dark',name:'Dark (Carto)',tpl:'https://a.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'},
 {id:'light',name:'Light (Carto)',tpl:'https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png'},
 {id:'cycle',name:'Cycle (CyclOSM)',tpl:'https://a.tile-cyclosm.openstreetmap.fr/cyclosm/{z}/{x}/{y}.png'},
 {id:'humanitarian',name:'Humanitarian',tpl:'https://a.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png'},
 {id:'custom',name:'Custom / API key…',tpl:''},
];
let CURLAYER={id:'osm',tpl:MAPLAYERS[0].tpl,key:''};
function tileURL(tpl,z,x,y,key){return tpl.replace('{z}',z).replace('{x}',x).replace('{y}',y).replace('{s}','a').replace('{key}',key||'').replace('{apikey}',key||'');}
async function fetchTile(z,x,y){const key=CURLAYER.id+'/'+z+'/'+x+'/'+y;const c=await tileGet(key);if(c)return URL.createObjectURL(c);
  if(!CURLAYER.tpl)return null;const url=tileURL(CURLAYER.tpl,z,x,y,CURLAYER.key);
  try{const r=await fetch(url);if(!r.ok)throw 0;const b=await r.blob();tilePut(key,b);return URL.createObjectURL(b);}catch(e){return null;}}
definePage('map','MAP',`<svg viewBox="0 0 24 24"><path class="stroke" d="M9 3L3 5v16l6-2 6 2 6-2V3l-6 2-6-2z"/><path class="stroke" d="M9 3v16M15 5v16"/></svg>`,(p)=>{
  p.innerHTML=`<div class="hd"><h2>Map</h2><span class="sub">multi-layer · caches off-grid</span>

    <div class="grow" id="mview" style="overflow:hidden;background:#0a0a0c;touch-action:none;cursor:grab">

    <div class="ctrls" style="flex-direction:column;align-items:stretch">

        <input id="mCustom" type="text" placeholder="tile URL: https://…/{z}/{x}/{y}.png  (use {key} for API key)" style="flex:1">
        <input id="mKey" type="text" placeholder="API key" style="width:100px"><button class="btn" id="mCustomGo">SET</button></div>

  const view=$('#mview',p),tiles=$('#mtiles',p),mark=$('#mmark',p);
  function render(){const W=view.clientWidth,H=view.clientHeight;const z=MAP.zoom;
    const cpx=lon2px(MAP.lon,z),cpy=lat2py(MAP.lat,z),tlx=cpx-W/2,tly=cpy-H/2,n=1<<z;
    const x0=Math.floor(tlx/256),x1=Math.floor((tlx+W)/256),y0=Math.floor(tly/256),y1=Math.floor((tly+H)/256);
    const need=new Set();
    for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(y<0||y>=n)continue;const tx=((x%n)+n)%n;const key=z+'/'+tx+'/'+y+'@'+x;

    $('#mz',p).textContent=MAP.zoom;$('#mll',p).textContent=MAP.lat.toFixed(4)+','+MAP.lon.toFixed(4);}
  // pan

  view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,lat:MAP.lat,lon:MAP.lon};view.setPointerCapture(e.pointerId);view.style.cursor='grabbing';});
  view.addEventListener('pointermove',e=>{if(!drag)return;const z=MAP.zoom;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    MAP.lon=px2lon(lon2px(drag.lon,z)-dx,z);MAP.lat=py2lat(lat2py(drag.lat,z)-dy,z);render();});
  view.addEventListener('pointerup',()=>{drag=null;view.style.cursor='grab';});
  view.addEventListener('wheel',e=>{e.preventDefault();MAP.zoom=clamp(MAP.zoom+(e.deltaY<0?1:-1),2,19);render();},{passive:false});
  $('#mZin',p).onclick=()=>{MAP.zoom=clamp(MAP.zoom+1,2,19);render();};
  $('#mZout',p).onclick=()=>{MAP.zoom=clamp(MAP.zoom-1,2,19);render();};
  $('#mGps',p).onclick=()=>geoNow(pos=>{if(pos){MAP.lat=pos.lat;MAP.lon=pos.lon;MAP.zoom=Math.max(MAP.zoom,15);render();toast('Centered on GPS');}else toast('No GPS fix');});
  $('#mPin',p).onclick=()=>{MAP.pins.push({lat:MAP.lat,lon:MAP.lon,t:Date.now()});
    localStorage.setItem('sv_pins',JSON.stringify(MAP.pins));render();toast('Pin dropped at center');};
  $('#mCache',p).onclick=async()=>{const W=view.clientWidth,H=view.clientHeight;let count=0,total=0;
    toast('Caching area for offline…');
    for(let dz=0;dz<=2;dz++){const z=Math.min(MAP.zoom+dz,19);const cpx=lon2px(MAP.lon,z),cpy=lat2py(MAP.lat,z);
      const tlx=cpx-W/2,tly=cpy-H/2,n=1<<z;
      const x0=Math.floor(tlx/256),x1=Math.floor((tlx+W)/256),y0=Math.floor(tly/256),y1=Math.floor((tly+H)/256);
      for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++){if(y<0||y>=n)continue;total++;

definePage('lora','LORA',`<svg viewBox="0 0 24 24"><path class="stroke" d="M4 12a8 8 0 018-8M4 12a8 8 0 008 8M20 12a8 8 0 00-8-8"/><circle class="fill" cx="12" cy="12" r="2.4"/><path class="stroke" d="M7 12a5 5 0 015-5M17 12a5 5 0 00-5-5"/></svg>`,(p)=>{
  p.innerHTML=`<div class="hd"><h2>LoRa Messaging</h2><span class="sub">serial dongle or bridge radio</span>
    <div class="sp"></div><span class="pill" id="lorast">○ offline</span></div>
    <div class="ctrls" style="border-top:0;border-bottom:1px solid var(--line)">
      <button class="btn" id="loraSerial">🔌 Connect dongle</button>
      <button class="btn" id="loraBridge">📡 Use bridge</button>
      <select id="loraBaud"><option>9600</option><option>115200</option><option>57600</option></select>
      <input id="loraCall" type="text" placeholder="call sign (optional)" style="width:120px"></div>
    <div class="grow scroll" id="loralog" style="padding:9px;display:flex;flex-direction:column;gap:5px"></div>
    <div class="ctrls">
      <input id="loratx" type="text" placeholder="message…" style="flex:1">
      <button class="btn danger" id="lorasend">▸ SEND</button></div>`;
  const LORA={port:null,reader:null,mode:null};
  const status=(m,on)=>{$('#lorast',p).textContent=(on?'● ':'○ ')+m;$('#lorast',p).className='pill'+(on?' on':'');};
  function addMsg(dir,msg){S.loraLog=S.loraLog||[];if(dir)S.loraLog.push({dir,msg,t:Date.now()});render();}
  function render(){const l=$('#loralog',p);if(!l)return;l.innerHTML=(S.loraLog||[]).slice(-80).map(m=>
    `<div style="align-self:${m.dir==='tx'?'flex-end':'flex-start'};max-width:80%;background:${m.dir==='tx'?'rgba(255,42,58,.15)':'rgba(56,192,255,.12)'};border:1px solid ${m.dir==='tx'?'rgba(255,42,58,.4)':'rgba(56,192,255,.4)'};border-radius:8px;padding:5px 8px;font-size:12px;color:#fff">${esc(m.msg)}<div style="font-size:8px;color:var(--grey)">${new Date(m.t).toLocaleTimeString('en-GB')}</div></div>`).join('');
    l.scrollTop=l.scrollHeight;}
  function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
  window.addEventListener('lora',render);
  $('#loraSerial',p).onclick=async()=>{
    if(!('serial'in navigator)){toast('WebSerial not available here — use the installed app or Chrome');return;}
    try{const port=await navigator.serial.requestPort();await port.open({baudRate:+$('#loraBaud',p).value});
      LORA.port=port;LORA.mode='serial';status('dongle linked',true);toast('LoRa dongle connected');
      const dec=new TextDecoderStream();port.readable.pipeTo(dec.writable).catch(()=>{});const reader=dec.readable.getReader();LORA.reader=reader;
      let buf='';(async()=>{try{while(true){const {value,done}=await reader.read();if(done)break;buf+=value;
        let i;while((i=buf.search(/[\r\n]/))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(line)addMsg('rx',line);}}}catch(e){}})();
    }catch(e){toast('Serial: '+(e.message||e.name));}};
  $('#loraBridge',p).onclick=()=>{LORA.mode='bridge';status('via bridge',true);toast('LoRa routed through SDR bridge');};
  async function send(){const t=$('#loratx',p).value.trim();if(!t)return;const call=$('#loraCall',p).value.trim();
    const payload=call?call+': '+t:t;
    if(LORA.mode==='serial'&&LORA.port&&LORA.port.writable){try{const wr=LORA.port.writable.getWriter();
      await wr.write(new TextEncoder().encode(payload+'\r\n'));wr.releaseLock();addMsg('tx',payload);}catch(e){toast('Write failed');}}
    else if(LORA.mode==='bridge'||BRIDGE.ws){if(BRIDGE.send({cmd:'lora-tx',msg:payload}))addMsg('tx',payload);}
    else toast('Connect a dongle or the bridge first');
    $('#loratx',p).value='';}
  $('#lorasend',p).onclick=send;
  $('#loratx',p).addEventListener('keydown',e=>{if(e.key==='Enter')send();});
  render();
});
