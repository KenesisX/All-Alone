   <div id="medbody"></div>`;
  document.body.appendChild(w);
  MED={w,body:$('#medbody',w),data:loadMed(),mode:'read'};
  $('#medClose',w).onclick=()=>{w.classList.remove('on');};
  $('#medEdit',w).onclick=()=>{MED.mode=MED.mode==='read'?'edit':'read';
    $('#medEdit',w).textContent=MED.mode==='edit'?'✓ Done':'✎ Edit';render();};
  function nm(){const m=MED.data;$('#medname',w).textContent=m.name?m.name+(m.blood?' · '+m.blood:''):'';}
  function render(){nm();MED.mode==='edit'?renderEdit():renderRead();}
  function renderRead(){const m=MED.data,b=MED.body;b.innerHTML='';
    const any=m.name||m.conditions||m.allergies||(m.meds&&m.meds.length)||(m.contacts&&m.contacts.length);
    if(!any){b.innerHTML='<div class="medsec"><div class="medbig">No medical info saved yet. Tap <b style="color:#fff">✎ Edit</b> to add your conditions, medications, physicians and emergency contacts. It is stored only on this device.</div></div>';return;}
    const sec=(title,html)=>{const d=el('div','medsec');d.innerHTML=`<h4>${title}</h4>${html}`;b.appendChild(d);};
    let id='';if(m.name)id+=`<div class="medrow"><span>Name</span><b>${esc(m.name)}</b></div>`;
    if(m.dob)id+=`<div class="medrow"><span>DOB</span><b>${esc(m.dob)}</b></div>`;
    if(m.blood)id+=`<div class="medrow"><span>Blood type</span><b>${esc(m.blood)}</b></div>`;
    id+=`<div class="medrow"><span>Organ donor</span><b>${m.donor?'Yes':'—'}</b></div>`;
    if(id)sec('Identity',id);
    if(m.allergies)sec('Allergies &amp; reactions',`<div style="color:#ff6a78;font-size:13px">${esc(m.allergies)}</div>`);
    if(m.conditions)sec('Medical conditions',`<div style="color:#fff;font-size:13px;white-space:pre-wrap">${esc(m.conditions)}</div>`);
    if(m.meds&&m.meds.length)sec('Medications',m.meds.map(x=>`<div class="medrow"><b>${esc(x.name||'')}</b><span>${esc(x.dose||'')} ${esc(x.freq||'')}</span></div>`).join(''));
    if(m.docs&&m.docs.length)sec('Physicians',m.docs.map(x=>`<div class="medrow"><span><b>${esc(x.name||'')}</b> ${esc(x.spec||'')}</span>${x.phone?`<a class="medtel" href="tel:${esc(x.phone)}">${esc(x.phone)}</a>`:''}</div>`).join(''));
    if(m.contacts&&m.contacts.length)sec('Emergency contacts',m.contacts.map(x=>`<div class="medrow"><span><b>${esc(x.name||'')}</b> ${esc(x.rel||'')}</span>${x.phone?`<a class="medtel" href="tel:${esc(x.phone)}">${esc(x.phone)}</a> ${x.phone?`<a class="medtel" href="sms:${esc(x.phone)}">✉</a>`:''}`:''}</div>`).join(''));
    if(m.notes)sec('Notes',`<div style="color:#fff;white-space:pre-wrap">${esc(m.notes)}</div>`);
  }
  function renderEdit(){const m=MED.data,b=MED.body;b.innerHTML='';
    const bind=(key)=>{const i=document.activeElement;return (e)=>{m[key]=e.target.value;saveMed(m);nm();};};
    function fieldSec(title,rows){const d=el('div','medsec');d.innerHTML=`<h4>${title}</h4>`;
      rows.forEach(([ph,key,ta])=>{const inp=el(ta?'textarea':'input','');inp.placeholder=ph;inp.value=m[key]||'';
        if(ta)inp.rows=2;inp.oninput=e=>{m[key]=e.target.value;saveMed(m);nm();};d.appendChild(inp);});
      b.appendChild(d);return d;}
    const idSec=fieldSec('Identity',[['Full name','name'],['Date of birth','dob'],['Blood type (e.g. O+)','blood']]);
    const dl=el('label','');dl.style.cssText='display:flex;gap:7px;align-items:center;font-size:12px;color:#fff;margin-top:4px';
    const dc=el('input','');dc.type='checkbox';dc.checked=!!m.donor;dc.onchange=e=>{m.donor=e.target.checked;saveMed(m);};
    dl.append(dc,document.createTextNode(' Organ donor'));idSec.appendChild(dl);
    fieldSec('Allergies & reactions',[['Penicillin, bee stings, latex…','allergies',1]]);
    fieldSec('Medical conditions / problems',[['Diabetes, asthma, epilepsy…','conditions',1]]);
    listSec('Medications','meds',[['Medication','name'],['Dose','dose'],['Schedule','freq']]);
    listSec('Physicians','docs',[['Doctor name','name'],['Specialty','spec'],['Phone','phone']]);
    listSec('Emergency contacts','contacts',[['Name','name'],['Relationship','rel'],['Phone','phone']]);
    fieldSec('Notes',[['Anything responders should know…','notes',1]]);
    function listSec(title,arrKey,cols){const d=el('div','medsec');d.innerHTML=`<h4>${title}</h4>`;
      if(!m[arrKey])m[arrKey]=[];const list=el('div','');d.appendChild(list);
      function draw(){list.innerHTML='';m[arrKey].forEach((row,i)=>{const r=el('div','medlrow');
        cols.forEach(([ph,key])=>{const inp=el('input','');inp.placeholder=ph;inp.value=row[key]||'';
          inp.oninput=e=>{row[key]=e.target.value;saveMed(m);};r.appendChild(inp);});
        const x=el('button','btn','✕');x.onclick=()=>{m[arrKey].splice(i,1);saveMed(m);draw();};r.appendChild(x);list.appendChild(r);});}
      const add=el('button','btn','+ Add');add.onclick=()=>{m[arrKey].push({});saveMed(m);draw();};
      d.appendChild(add);b.appendChild(d);draw();}
  }
  function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}
  MED.open=()=>{MED.data=loadMed();MED.mode='read';$('#medEdit',w).textContent='✎ Edit';w.classList.add('on');render();};
}
function openMedID(){initMedID();MED.open();}

/* ================= PER-PAGE HELP (how-to) ======================= */
const HELP={
 radar:['CSI / Motion Radar','Shows REAL motion the camera detects plus any device your SDR bridge feeds.','1. Open SCOPE and tap START to turn the camera on (allow it).','2. Come back here — moving things appear as red tracked targets sized bird→vehicle; still objects show hollow/white.','3. For RF device contacts, link an SDR in SOURCE.'],
 cam:['Scope / Camera','1. Tap START (or ◉ ARM ALL up top) and ALLOW the camera prompt.','2. Pick a specific camera from the dropdown (Auto = front/back). Any webcam/USB cam shows here once allowed.','3. ZOOM slider = telescopic; filters recolor; RETICLE adds a crosshair; 🎯 FIRE takes a photo; ● REC records video.','If the screen stays black in a browser tab, open the app full-screen — some embeds block the camera.'],
 source:['SDR Source / Bridge','Link a radio two ways:','• BRIDGE (best, e.g. RTL-SDR Blog V4): run allalone-bridge.py on your Pi/PC with the dongle, then type ws://<that-computer-IP>:8765 here and tap CONNECT.','• WebUSB: tap CLAIM RTL-SDR DONGLE on desktop Chrome (V4 tuner is better over the bridge).','Spectrum then feeds the waterfall, scatter and radar.'],
 lora:['LoRa Messaging','• Dongle: plug a LoRa USB module, tap 🔌 Connect dongle (WebSerial — desktop or Android Chrome), pick the baud.','• Bridge: tap 📡 Use bridge to route messages through your SDR bridge radio.','Type a message and SEND. Incoming messages appear on the left.'],
 map:['Map','• LAYER dropdown switches street / satellite / topo / terrain / dark / custom. Pick "Custom" to paste your own tile URL or API key.','• Drag to pan, ＋/－ zoom, 📍 centers on GPS.','• ⬇ Cache area downloads tiles so the map works OFF-GRID later.','• 📌 drops a waypoint.'],
 emergency:['Emergency / SOS','1. Pick an incident type (fills a template).','2. Add details, tap 📍 LOCK GPS + BUILD SOS.','3. Share/Text it, open the Map link, or send 📡 LoRa SOS via the bridge.','✅ ALL CLEAR cancels a false alarm; 🧪 TEST is a safe drill (never dispatches).'],
 deter:['Wildlife Deterrent','1. Pick the species for real do/don\'t guidance.','2. Tap a sound profile (boom/bell/siren/whistle/horn/growl) — it loops.','3. 🔊/🔇 mute, VOL ± change loudness, STOP ends it.'],
 compass:['Compass','Tap ENABLE and allow motion. Tilt the phone and the dial moves in perspective; the ☀ sun rides the ring east→west.'],
 sky:['Sky / Satellites','Tap ENABLE, allow location + motion, and point at the sky. You\'ll see the sun, bright stars and geostationary satellites with azimuth/elevation, plus sunrise/sunset.'],
 emf:['EMF / Magnetometer','Tap START for a live µT reading. Tap ⌖ ZERO to set a baseline — then nearby metal or electronics shows up as an anomaly spike.'],
 light:['Flashlight','TORCH toggles the camera flash (ALL OFF kills everything). Screen light / Strobe / SOS blink use the screen when there is no hardware torch.'],
 perms:['Permissions','GRANT ALL requests camera, mic, location, motion and magnetometer at once. Accept each system prompt. Grant them one-by-one with the per-row buttons.'],
 field:['Field ID & Finds','Pick a category (tracks/rocks/berries/plants/animals), set the feature filters to narrow the candidates, 📷 PHOTO the specimen, and 📍 LOG GPS FIND to save it with your location.'],
 listen:['Wildlife Listen','Tap 🎙 MIC to analyze a call (pitch/rhythm). ● REC saves audio. DTMF: hold the speaker to your Baofeng to SEND repeater tones, or point the mic at it to DECODE incoming tones.'],
 water:['Waterfall','Tap ◉ MIC (or link an SDR in SOURCE). Frequency runs left→right, newest at top scrolling down. The table lists detected devices.'],
 gen:['Waveform Generator','Pick a wave, set FREQ/VOL, tap EMIT for a continuous tone or a burst mode. Audio range only — phones can\'t emit RF.'],
 tx:['TX / Inject','Sends transmit/inject COMMANDS to your own authorized bridge hardware — the phone transmits nothing itself. Connect the bridge in SOURCE first.'],
};
let HLP=null;
function initHelp(){ if(HLP)return;
  const css=el('style',null,`#helpBtn{font-family:var(--mono);font-weight:700;color:var(--cyan2);background:rgba(40,40,46,.6);
     border:1px solid var(--line);border-radius:50%;width:22px;height:22px;cursor:pointer;line-height:1}
   #helpwrap{position:fixed;inset:0;z-index:132;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:16px}
   #helpwrap.on{display:flex}
   #helpbox{max-width:420px;width:100%;max-height:80%;overflow:auto;background:var(--char);border:1px solid var(--line);border-radius:12px;padding:14px}
   #helpbox h3{margin:0 0 8px;color:var(--cyan2);font-size:15px}
   #helpbox p{font-size:13px;color:#fff;line-height:1.55;margin:6px 0}`);
  document.head.appendChild(css);
  const w=el('div');w.id='helpwrap';w.innerHTML=`<div id="helpbox"></div>`;
  w.onclick=e=>{if(e.target===w)w.classList.remove('on');};
  document.body.appendChild(w);HLP=w;
}
function openHelp(){initHelp();const id=PAGES[activeIdx]&&PAGES[activeIdx].id;
  const h=HELP[id]||['This page','Use the controls at the bottom. Tap ◉ ARM ALL at the top to grant camera, mic and motion.'];
  $('#helpbox',HLP).innerHTML=`<h3>❓ ${h[0]}</h3>`+h.slice(1).map(s=>`<p>${s}</p>`).join('')+`<p style="color:var(--grey);font-size:11px">Tap outside to close.</p>`;
  HLP.classList.add('on');}

/* ================= BUILD UI ====================================== */
let activeIdx=0;
// group + order the side rail so it reads top-to-bottom by purpose
const GRP=[['SENSE',['radar','cam','compass','sky']],
  ['SIGNAL',['water','scatter','sound','gen','csi','packet','uv','heat','mesh']],
  ['RF/SDR',['source','tx','lora','burst','emf']],
  ['FIELD',['field','listen','deter','map']],
  ['SAFETY',['sos','light','perms']]];
const order=[];GRP.forEach(([_,ids])=>ids.forEach(id=>{const pg=PAGES.find(x=>x.id===id);if(pg&&!order.includes(pg))order.push(pg);}));
PAGES.forEach(pg=>{if(!order.includes(pg))order.push(pg);}); // any stragglers
PAGES.length=0;order.forEach(pg=>PAGES.push(pg));
const grpOf={};GRP.forEach(([name,ids])=>ids.forEach(id=>grpOf[id]=name));
let lastGrp=null;
PAGES.forEach((pg,i)=>{
  const page=el('div','page'+(i===0?' active':''));page.id='pg-'+pg.id;
  stage.appendChild(page);pg.el=page;pg.build(page);
  const g=grpOf[pg.id]||'MORE';
  if(g!==lastGrp){lastGrp=g;const hdr=el('div','rgrp',g);rail.appendChild(hdr);}
  const ic=el('div','ric'+(i===0?' sel':''),pg.icon+`<div class="lbl">${pg.label}</div>`);
  ic.onclick=()=>select(i);rail.appendChild(ic);
});
function select(i){const _prev=PAGES[activeIdx];if(_prev&&_prev.el.onHide)try{_prev.el.onHide();}catch(e){}
  activeIdx=i;
  PAGES.forEach((pg,j)=>pg.el.classList.toggle('active',j===i));
  [...rail.children].forEach((c,j)=>c.classList.toggle('sel',j===i));
  pop.style.display='none';
  const cur=PAGES[i].el; if(cur.onShow)try{cur.onShow();}catch(e){}
}

/* master render loop */
function loop(){pollAudio();motionTick();
  const ab=$('#armBtn');if(ab)ab.classList.toggle('armed',S.camRunning||S.audioReady===true||S.headingOK||!!S.mag||!!S.pos);
  const pg=PAGES[activeIdx];if(pg&&pg.el.draw)try{pg.el.draw();}catch(e){}
  requestAnimationFrame(loop);}
requestAnimationFrame(loop);

/* first-touch unlock for audio/sensors (mobile autoplay policy) */
let armed=false;
function armOnce(){if(armed)return;armed=true;initMotion();}  // light touch; full prompts come from ARM
document.addEventListener('pointerdown',armOnce,{once:true});
window.addEventListener('freqchange',()=>{});

/* boot */
BRIDGE.init();
initMedID();const _med=$('#medBtn');if(_med)_med.onclick=openMedID;
initHelp();const _help=$('#helpBtn');if(_help)_help.onclick=openHelp;
const _arm=$('#armBtn');if(_arm)_arm.onclick=()=>armAll();
setTimeout(()=>toast('ALLALONE online · tap ◉ ARM ALL to grant camera · mic · motion',3800),400);
</script>
